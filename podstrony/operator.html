<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proste Działania Matematyczne</title>
</head>
<body>
    <h1>Witaj na stronie z działaniami matematycznymi!</h1>
    <p>Otwórz konsolę, aby zobaczyć wyniki działań matematycznych.</p>

    <script>
        const x = 10;
        const y = 5;

        let wynikDodawania = x + y;
        console.log("Wynik dodawania: " + wynikDodawania);

        var wynikOdejmowania = x - y;
        console.log("Wynik odejmowania: " + wynikOdejmowania);

        let wynikMnożenia = x * y;
        console.log("Wynik mnożenia: " + wynikMnożenia);

        let wynikDzielenia = x / y;
        console.log("Wynik dzielenia: " + wynikDzielenia);
    </script>
</body>
</html>
